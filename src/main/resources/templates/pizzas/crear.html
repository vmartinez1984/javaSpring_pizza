<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar pizza nueva</title>
</head>
<body>
    <h1>Pizza nueva</h1>
    <p>Aca va el formulario</p>
    <form th:action="@{/pizzas/crear}" th:object="${pizzaDtoIn}" method="post">
        
        <div>
            <label for="nombre">Nombre:</label>
            <!-- th:field se conecta automáticamente con el atributo 'nombre' -->
            <input type="text" id="nombre" name="nombre" th:field="*{nombre}" required />
        </div>

        <div>
            <label for="descripcion">Descripción:</label>
            <textarea id="descripcion" th:field="*{descripcion}"></textarea>
        </div>

        <div>
            <label for="precio">Precio:</label>
            <!-- Usamos type="number" con step para aceptar decimales -->
            <input type="number" step="0.01" id="precio" th:field="*{precio}" required />
        </div>

        <div>
            <button type="submit">Guardar Pizza</button>
        </div>

    </form>
</body>
</html>
